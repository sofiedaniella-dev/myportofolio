{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container" style="max-width: 700px; margin: 2rem auto;">
    <h1 style="font-family: serif; font-size: 2.2rem; margin-bottom: 1.5rem;">Add New Projects</h1>

    <form method="POST" class="project-form">
        {% csrf_token %}

        <!-- Iterasi setiap field agar menggunakan class .form-group sesuai CSS kamu -->
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="form-error">
                        {{ field.errors.0 }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <div style="margin-top: 1.5rem; display: flex; gap: 0.8rem;">
            <button type="submit" class="button">
                Tambah Project
            </button>
            <a href="{% url 'main:show_projects' %}" class="button button-secondary">
                Batal
            </a>
        </div>
    </form>
</div>
{% endblock content %}
